<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a2a5e">
<title>Путь лозы — карманный справочник</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1f1b24; --muted:#6b6472; --line:#e3dde8;
  --accent:#4a2a5e; --accent-soft:#efe7f4; --green:#3f7d20; --green-soft:#e6f2dc;
  --warn:#9a5b00; --warn-soft:#fff1d6; --bad:#a32626; --bad-soft:#fbe3e3; --info:#1f5d8c; --info-soft:#e2eef8;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16131a; --card:#221e28; --ink:#eee9f2; --muted:#a79fb0; --line:#383241;
    --accent:#c9a3e3; --accent-soft:#33283d; --green:#8ccf64; --green-soft:#23321b;
    --warn:#f0b454; --warn-soft:#3a2d15; --bad:#f08a8a; --bad-soft:#3d1f1f; --info:#86bfeb; --info-soft:#1b2c3b; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;padding:10px 16px calc(10px) 16px;padding-top:calc(10px + env(safe-area-inset-top))}
@media (prefers-color-scheme: dark){ header{background:#2e1f3a} }
header h1{font-size:18px;margin:0;font-weight:650}
header .sub{font-size:12.5px;opacity:.85}
main{max-width:720px;margin:0 auto;padding:12px 16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:8px 2px 9px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--accent);font-weight:650}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
h2{font-size:17px;margin:4px 0 8px}
h3{font-size:15px;margin:10px 0 6px}
.muted{color:var(--muted);font-size:13.5px}
.small{font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--accent-soft);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:19px}
.stat span{font-size:12px;color:var(--muted)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -4px}
.day{flex:0 0 auto;min-width:62px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 4px;font-size:12.5px}
.day.frost{background:var(--info-soft);border-color:var(--info)}
.day .t{font-weight:650;font-size:14px}
button,.btn{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:9px 14px;cursor:pointer}
@media (prefers-color-scheme: dark){ button,.btn{color:#1b1520} }
button.ghost{background:transparent;color:var(--accent)}
button.small{padding:5px 10px;font-size:13.5px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
a{color:var(--accent)}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13.5px;background:var(--card);color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){ .chip.on{color:#1b1520} }
ul.check{list-style:none;padding:0;margin:0}
ul.check li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
ul.check li:first-child{border-top:0}
ul.check input{width:22px;height:22px;flex:0 0 22px;margin-top:1px;accent-color:var(--accent)}
ul.check li.done .tx{text-decoration:line-through;color:var(--muted)}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin-right:4px;vertical-align:1px;font-weight:600}
.k-do{background:var(--green-soft);color:var(--green)}
.k-check{background:var(--info-soft);color:var(--info)}
.k-warn{background:var(--warn-soft);color:var(--warn)}
.k-dont{background:var(--bad-soft);color:var(--bad)}
.why{font-size:13px;color:var(--muted);margin-top:2px}
.src{font-size:11.5px;color:var(--muted)}
.dyn{font-size:13px;margin-top:3px;padding:5px 8px;border-radius:8px;background:var(--accent-soft)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12.5px}
.alert{border-radius:10px;padding:9px 12px;margin:0 0 12px;font-size:14px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--info-soft);color:var(--info)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.photos .ph{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;background:#0001}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .badge{position:absolute;left:4px;bottom:4px;font-size:10.5px;background:#000a;color:#fff;border-radius:6px;padding:1px 5px}
.big-img{width:100%;border-radius:10px;display:block}
details{border-top:1px solid var(--line);padding:8px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600}
.score{font-size:12px;color:var(--muted)}
.hidden{display:none!important}
.list-item{padding:8px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.sticky-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>Путь лозы</h1>
  <div class="sub" id="hdrSub">Карманный справочник виноградаря</div>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-tab="today" class="on"><span class="ic">☀</span>Сегодня</button>
  <button data-tab="works"><span class="ic">✂</span>Работы</button>
  <button data-tab="ill"><span class="ic">🍃</span>Болезни</button>
  <button data-tab="photo"><span class="ic">📷</span>Фото</button>
  <button data-tab="more"><span class="ic">☰</span>Ещё</button>
</nav>
<input type="file" id="fileInput" accept="image/*" capture="environment" class="hidden">
<input type="file" id="importInput" accept="application/json,.json" class="hidden">
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
